[project]
name = "2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "arshtyi", email = "arshtyi@foxmail.com" },
]
requires-python = ">=3.13"
dependencies = [
]

[dependency-groups]
dev = [
    "ruff>=0.16.6",
    "ty>=0.0.78",
]

[tool.ruff]
line-length = 150

[tool.ruff.lint]
extend-select = [
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
    "PERF",
]

[tool.ruff.format]
quote-style               = "double"
indent-style              = "space"
line-ending               = "auto"
skip-magic-trailing-comma = false

[tool.ty.src]
include = [
    "src",
]
